<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b90df2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="120" ry="120" fill="#0f172a" />
  
  <!-- Glow behind the box -->
  <circle cx="256" cy="256" r="180" fill="url(#grad1)" opacity="0.15" filter="url(#glow)" />
  
  <!-- Abstract Box Icon -->
  <g transform="translate(106, 106) scale(0.6)">
    <!-- Main Box Shape -->
    <path d="M250 50 L450 150 L250 250 L50 150 Z" fill="url(#grad1)" opacity="0.9" />
    <path d="M50 150 L250 250 L250 450 L50 350 Z" fill="#b90df2" opacity="0.7" />
    <path d="M450 150 L450 350 L250 450 L250 250 Z" fill="#10b981" opacity="0.7" />
    
    <!-- Top Highlight -->
    <path d="M250 50 L450 150 L250 250 L50 150 Z" fill="white" opacity="0.1" />
    
    <!-- Inner details for tech look -->
    <path d="M250 250 L250 450" stroke="rgba(255,255,255,0.2)" stroke-width="10" />
    <path d="M50 150 L250 250" stroke="rgba(255,255,255,0.2)" stroke-width="10" />
    <path d="M450 150 L250 250" stroke="rgba(255,255,255,0.2)" stroke-width="10" />
  </g>
</svg>
